name: v94 10a shichrut source probe

on:
  push:
    branches:
      - v94/architecture-migration

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94/architecture-migration
      - name: Probe source
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          qs=['השפעה או סירוב','שכרות מכוח סירוב','הפסיקה במסלול זה מתמקדת בצירוף של נהיגה ללא רישיון','סירוב לבדיקה','שכרות']
          out=[]
          for q in qs:
              start=0
              out.append('\n===== '+q+' =====\n')
              while True:
                  i=s.find(q,start)
                  if i<0: break
                  out.append('POS '+str(i)+'\n')
                  out.append(s[max(0,i-1800):i+3200]+'\n')
                  start=i+len(q)
                  if start>i+100000: break
          Path('docs').mkdir(exist_ok=True)
          Path('docs/v94-10a-shichrut-source-probe.txt').write_text(''.join(out),encoding='utf-8')
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v94-10a-shichrut-source-probe.txt
          git commit -m 'Capture 10a shichrut source probe' || exit 0
          git pull --rebase origin v94/architecture-migration
          git push origin HEAD:v94/architecture-migration
