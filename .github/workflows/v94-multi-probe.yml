name: v94 multi-card probe

on:
  push:
    branches:
      - v94/architecture-migration

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94/architecture-migration
      - name: Extract multi-card code
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['function buildMultiCards','function toggleMultipleUI','function snapshotMultiCardFields','function restoreMultiCardFields','function applyMultiCardsExact']
          out=[]
          for n in needles:
              i=s.find(n)
              out.append('\n===== '+n+' @ '+str(i)+' =====\n')
              if i>=0:
                  out.append(s[max(0,i-800):i+5000])
          Path('docs').mkdir(exist_ok=True)
          Path('docs/v94-multi-card-probe.txt').write_text(''.join(out),encoding='utf-8')
      - name: Commit probe
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v94-multi-card-probe.txt
          git commit -m 'Probe v94 multi-card implementation' || exit 0
          git push origin HEAD:v94/architecture-migration
