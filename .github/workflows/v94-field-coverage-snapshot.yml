name: v94 field coverage snapshot

on:
  push:
    branches:
      - v94/architecture-migration

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94/architecture-migration
      - name: Build coverage without threshold
        run: |
          cp v94/field-coverage-report.js /tmp/report.js
          sed -i "/Coverage below 95%/d" /tmp/report.js
          node /tmp/report.js
      - name: Commit snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v94-field-coverage.json docs/v94-field-coverage.md
          git commit -m 'Refresh v94 field coverage snapshot' || exit 0
          git push origin HEAD:v94/architecture-migration