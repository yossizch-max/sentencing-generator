name: Apply v93.8.13.5.5 scales hero

on:
  push:
    branches:
      - design/v93.8.13.5.5-scales-hero

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/v93.8.13.5.5-scales-hero

      - name: Patch hero artwork only
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('v93.8.13.5.4','v93.8.13.5.5',1)
          svg="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23d2a85c'/%3E%3Cstop offset='.5' stop-color='%23966b2f'/%3E%3Cstop offset='1' stop-color='%236a451f'/%3E%3C/linearGradient%3E%3Cfilter id='s' x='-20%25' y='-20%25' width='140%25' height='140%25'%3E%3CfeDropShadow dx='0' dy='5' stdDeviation='5' flood-color='%23000' flood-opacity='.16'/%3E%3C/filter%3E%3C/defs%3E%3Cg filter='url(%23s)' stroke='url(%23g)' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M210 28v118M154 48h112M210 28l-12 18h24z'/%3E%3Cpath d='M154 48l-48 30M154 48l38 30M266 48l-38 30M266 48l48 30'/%3E%3Cpath d='M90 80l-26 44h52zM174 80l-26 44h52zM246 80l-26 44h52zM330 80l-26 44h52z'/%3E%3Cpath d='M88 126c13 10 32 10 44 0M160 126c13 10 32 10 44 0M232 126c13 10 32 10 44 0M304 126c13 10 32 10 44 0'/%3E%3Cpath d='M170 150h80M186 138h48'/%3E%3C/g%3E%3C/svg%3E"
          css=f'''
          <style id="v9355ScalesHero">
          /* v93.8.13.5.5 — visual-only: replace gavel hero art with justice scales on desktop and mobile. */
          @media (min-width:641px){{
            #splash .home-hero{{
              padding-right:390px!important;
              background-image:
                linear-gradient(to left,rgba(255,255,255,.10) 0%,rgba(255,255,255,.78) 35%,#fff 59%),
                url("{svg}")!important;
              background-repeat:no-repeat!important;
              background-position:right center!important;
              background-size:auto 94%!important;
            }}
          }}
          @media (max-width:640px){{
            #splash .home-hero{{
              min-height:176px!important;
              padding:18px 138px 18px 18px!important;
              background-image:
                linear-gradient(to left,rgba(255,255,255,.12) 0%,rgba(255,255,255,.78) 38%,#fff 62%),
                url("{svg}")!important;
              background-repeat:no-repeat!important;
              background-position:right center!important;
              background-size:auto 88%!important;
              text-align:center!important;
            }}
            #splash .home-hero h1{{font-size:30px!important;line-height:1.12!important;}}
            #splash .home-hero p{{font-size:14px!important;line-height:1.35!important;}}
          }}
          </style>
          '''
          if 'id="v9355ScalesHero"' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')

      - name: Verify patch
        shell: bash
        run: |
          grep -q 'v93.8.13.5.5' index.html
          grep -q 'id="v9355ScalesHero"' index.html
          grep -q 'replace gavel hero art with justice scales' index.html

      - name: Commit patched index.html
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply v93.8.13.5.5 scales hero'
          git push origin HEAD:design/v93.8.13.5.5-scales-hero
