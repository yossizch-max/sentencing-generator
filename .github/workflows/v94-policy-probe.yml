name: v94 policy function probe

on:
  push:
    branches:
      - v94/architecture-migration

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94/architecture-migration
      - name: Probe policy functions
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          qs=['policyTable10aShichrut','policyTable67_10a_Shichrut','shich_finding','shich_circ','ps67s_shich_type','ps67s_alcohol_level']
          out=[]
          for q in qs:
              out.append('\n===== '+q+' =====\n')
              start=0
              n=0
              while True:
                  i=s.find(q,start)
                  if i<0 or n>=30: break
                  out.append('POS '+str(i)+'\n')
                  out.append(s[max(0,i-3500):i+6000]+'\n')
                  start=i+len(q)
                  n+=1
          Path('docs').mkdir(exist_ok=True)
          Path('docs/v94-policy-function-probe.txt').write_text(''.join(out),encoding='utf-8')
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v94-policy-function-probe.txt
          git commit -m 'Capture policy function probe' || exit 0
          git pull --rebase origin v94/architecture-migration
          git push origin HEAD:v94/architecture-migration
