name: Build v94 architecture map

on:
  push:
    branches:
      - v94/architecture-migration

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94/architecture-migration

      - name: Analyze index.html
        shell: python
        run: |
          from pathlib import Path
          import re, json
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          targets = [
            "chooseMashlul","safeGenerate","generate","generate67_core","generateMultiple",
            "generate10a","generate67_10a","generate67ShichrutV66","generateV74Route",
            "generateAccidentInjury","getAllFields","setAllFields","applyFormState","postRestore",
            "RouteFieldStateManager","buildPastRecordSection","buildPlacementSection",
            "buildPlacementReasons","buildPlacementClosing","snapshotMultiCardFields",
            "restoreMultiCardFields","applyMultiCardsExact","restoreConditionalRecordLists",
            "exportToPDF","downloadWord","copyToClipboard"
          ]
          def cnt(pat):
              return len(re.findall(pat, s, re.M))
          rows = []
          for n in targets:
              defs = cnt(r"function\\s+" + re.escape(n) + r"\\s*\\(")
              win = cnt(r"window\\." + re.escape(n) + r"\\s*=")
              refs = s.count(n)
              rows.append((n, defs, win, refs))
          script_blocks = len(re.findall(r"<script\\b", s, re.I))
          ids = re.findall(r"\\bid=[\\\"']([^\\\"']+)[\\\"']", s, re.I)
          seen = {}
          for x in ids:
              seen[x] = seen.get(x, 0) + 1
          dups = sorted([k for k,v in seen.items() if v > 1])
          routes = ["67","10a","67+10a","shichrut","67_shichrut","10a_shichrut","67_10a_shichrut","accident_injury"]
          route_counts = dict((r, s.count(r)) for r in routes)
          prefixes = ["m_","cond_","disq_","bond_","traffic_","crim_","acc_","shich_","ps67s_","req_","defarg_","psdef_"]
          prefix_counts = {}
          for pr in prefixes:
              found = set(re.findall(r"\\bid=[\\\"'](" + re.escape(pr) + r"[A-Za-z0-9_\\-]+)", s))
              prefix_counts[pr] = len(found)
          wrapper_counts = {
            "chooseMashlul assignments": cnt(r"window\\.chooseMashlul\\s*="),
            "safeGenerate assignments": cnt(r"window\\.safeGenerate\\s*="),
            "generate assignments": cnt(r"window\\.generate\\s*="),
            "_mashlul writes": cnt(r"window\\._mashlul\\s*="),
            "MutationObservers": s.count("MutationObserver"),
            "setTimeout calls": s.count("setTimeout(")
          }
          md = []
          md.append("# v94 Architecture Map")
          md.append("")
          md.append("Generated automatically from the branch copy of index.html. No runtime behavior changed.")
          md.append("")
          md.append("## File baseline")
          md.append("- Size: {:,} characters".format(len(s)))
          md.append("- Script tags: {}".format(script_blocks))
          md.append("- DOM ids: {}".format(len(ids)))
          md.append("- Duplicate ids in source: {}".format(len(dups)))
          if dups:
              md.append("- Duplicate id sample: " + ", ".join(dups[:30]))
          md.append("")
          md.append("## Active architecture targets")
          md.append("| Symbol | function declarations | window assignments | textual refs |")
          md.append("|---|---:|---:|---:|")
          for a,b,c,d in rows:
              md.append("| {} | {} | {} | {} |".format(a,b,c,d))
          md.append("")
          md.append("## Wrapper / timing pressure")
          for k,v in wrapper_counts.items():
              md.append("- {}: **{}**".format(k,v))
          md.append("")
          md.append("## Route markers")
          for k,v in route_counts.items():
              md.append("- {}: {} occurrences".format(k,v))
          md.append("")
          md.append("## Field-family footprint")
          for k,v in prefix_counts.items():
              md.append("- {}*: {} distinct DOM ids".format(k,v))
          md.append("")
          md.append("## v94 migration rules")
          md.append("1. Do not replace any live generator in phase 1.")
          md.append("2. Introduce a canonical read-only CaseModel adapter from the existing DOM/state.")
          md.append("3. Compare CaseModel serialization against existing save/load state before any writer migration.")
          md.append("4. Migrate one route at a time only after output and numeric parity tests pass.")
          md.append("5. Do not remove legacy wrappers until reachability is covered by browser regression tests.")
          Path("docs").mkdir(exist_ok=True)
          Path("docs/v94-architecture-map.md").write_text("\\n".join(md), encoding="utf-8")
          data = {
            "targets":[{"name":a,"functionDeclarations":b,"windowAssignments":c,"refs":d} for a,b,c,d in rows],
            "wrapperCounts":wrapper_counts,
            "routeCounts":route_counts,
            "fieldPrefixCounts":prefix_counts,
            "duplicateIds":dups,
            "scriptBlocks":script_blocks,
            "charCount":len(s)
          }
          Path("docs/v94-architecture-map.json").write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")

      - name: Commit architecture map
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v94-architecture-map.md docs/v94-architecture-map.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Map v94 architecture baseline'
          git push origin HEAD:v94/architecture-migration
