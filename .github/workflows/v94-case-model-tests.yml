name: v94 migration gates

on:
  push:
    branches:
      - v94/architecture-migration

jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94/architecture-migration
          fetch-depth: 0

      - name: Gate 0 - production index remains untouched
        run: |
          git fetch origin main
          git diff --exit-code origin/main...HEAD -- index.html

      - name: Gate 1 - syntax
        run: |
          node --check v94/case-model-adapter.js
          node --check v94/test-utils.js
          node --check v94/case-model-adapter.test.js
          node --check v94/case-model-contract.test.js
          node --check v94/case-model-routes.test.js
          node --check v94/case-model-lists.test.js
          node --check v94/case-model-parity.test.js
          node --check v94/case-model-parity-expanded.test.js
          node --check v94/case-model-validation.test.js
          node --check v94/case-model-validation-expanded.test.js
          node --check v94/case-model-schema.test.js
          node --check v94/case-model-serialization.test.js
          node --check v94/case-model-route-facts.test.js
          node --check v94/case-model-accident.test.js
          node --check v94/browser-route-facts.mjs
          node --check v94/browser-route-facts-combined.mjs
          node --check v94/browser-route-facts-accident.mjs
          node --check v94/browser-route-roundtrip.mjs
          node --check v94/legacy-architecture-scan.js
          node --check v94/index-script-syntax.test.js
          node --check v94/dom-contract.test.js
          node --check v94/browser-case-model-smoke.mjs
          node --check v94/browser-case-model-deep.mjs

      - name: Gate 2 - all inline scripts compile
        run: node v94/index-script-syntax.test.js

      - name: Gate 3 - critical DOM contract
        run: node v94/dom-contract.test.js

      - name: Gate 4 - base adapter unit test
        run: node v94/case-model-adapter.test.js

      - name: Gate 5 - read-only contract
        run: node v94/case-model-contract.test.js

      - name: Gate 6 - all route snapshots
        run: node v94/case-model-routes.test.js

      - name: Gate 7 - dynamic lists and joined cases
        run: node v94/case-model-lists.test.js

      - name: Gate 8 - legacy parity core fields
        run: node v94/case-model-parity.test.js

      - name: Gate 8B - expanded legacy parity
        run: node v94/case-model-parity-expanded.test.js

      - name: Gate 9 - validation behavior
        run: node v94/case-model-validation.test.js

      - name: Gate 10 - schema contract
        run: node v94/case-model-schema.test.js

      - name: Gate 10B - expanded validation diagnostics
        run: node v94/case-model-validation-expanded.test.js

      - name: Gate 11 - portable serialization
        run: node v94/case-model-serialization.test.js

      - name: Gate 12 - route-specific canonical facts
        run: node v94/case-model-route-facts.test.js

      - name: Gate 13 - accident canonical facts
        run: node v94/case-model-accident.test.js

      - name: Gate 14 - legacy architecture scan
        run: node v94/legacy-architecture-scan.js

  browser:
    runs-on: ubuntu-latest
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94/architecture-migration

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/v94-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null

      - name: Gate 12A - browser load
        run: node v94/browser-case-model-smoke.mjs load

      - name: Gate 12B - browser read-only
        run: node v94/browser-case-model-smoke.mjs readonly

      - name: Gate 12C1 - route 67
        run: node v94/browser-case-model-smoke.mjs "route:67"

      - name: Gate 12C2 - route 10a
        run: node v94/browser-case-model-smoke.mjs "route:10a"

      - name: Gate 12C3 - route 67+10a
        run: node v94/browser-case-model-smoke.mjs "route:67+10a"

      - name: Gate 12C4 - route shichrut
        run: node v94/browser-case-model-smoke.mjs "route:shichrut"

      - name: Gate 12C5 - route 67_shichrut
        run: node v94/browser-case-model-smoke.mjs "route:67_shichrut"

      - name: Gate 12C6 - route 10a_shichrut
        run: node v94/browser-case-model-smoke.mjs "route:10a_shichrut"

      - name: Gate 12C7 - route 67_10a_shichrut
        run: node v94/browser-case-model-smoke.mjs "route:67_10a_shichrut"

      - name: Gate 12C8 - route accident_injury
        run: node v94/browser-case-model-smoke.mjs "route:accident_injury"

      - name: Gate 12C9 - accident_below_real alias
        run: node v94/browser-case-model-smoke.mjs "alias:accident_below_real"

      - name: Gate 12C10 - aggregate routes and aliases
        run: node v94/browser-case-model-smoke.mjs routes

      - name: Gate 12D - browser deterministic
        run: node v94/browser-case-model-smoke.mjs deterministic

      - name: Gate 12E - browser parity
        run: node v94/browser-case-model-smoke.mjs parity

      - name: Gate 13A - capture stress
        run: node v94/browser-case-model-deep.mjs capture-stress

      - name: Gate 13B - route stress
        run: node v94/browser-case-model-deep.mjs route-stress

      - name: Gate 13C - viewport matrix
        run: node v94/browser-case-model-deep.mjs viewports

      - name: Gate 13D1 - live multiple structure
        run: node v94/browser-case-model-deep.mjs multi-structure

      - name: Gate 13D2 - live multiple capture
        run: node v94/browser-case-model-deep.mjs multi-capture

      - name: Gate 13D3a - live multiple shrink model
        run: node v94/browser-case-model-deep.mjs multi-shrink-model

      - name: Gate 13D3b - live multiple shrink DOM
        run: node v94/browser-case-model-deep.mjs multi-shrink-dom

      - name: Gate 13D3c - live multiple shrink combined
        run: node v94/browser-case-model-deep.mjs multi-shrink

      - name: Gate 13E - live conditional lists
        run: node v94/browser-case-model-deep.mjs conditional-live

      - name: Gate 13F - legacy state roundtrip
        run: node v94/browser-case-model-deep.mjs legacy-roundtrip

      - name: Gate 14A - combined live-DOM mapping
        run: node v94/browser-route-facts-combined.mjs

      - name: Gate 14B - accident live-DOM mapping
        run: node v94/browser-route-facts-accident.mjs

      - name: Gate 14C - browser route-specific legacy roundtrip
        run: node v94/browser-route-roundtrip.mjs
