name: v94 writer67 diff capture

on:
  push:
    branches:
      - v94/architecture-migration

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94/architecture-migration
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 4173 >/tmp/v94-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:4173/index.html >/dev/null
      - name: Capture writer67 diff
        run: node v94/browser-writer67-diff.mjs
      - name: Commit diff report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v94-writer67-diff.json
          git commit -m 'Capture v94 writer67 diff report' || exit 0
          git push origin HEAD:v94/architecture-migration
