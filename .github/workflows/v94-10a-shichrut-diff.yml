name: v94 10a shichrut diff

on:
  push:
    branches:
      - v94/architecture-migration

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v94/architecture-migration
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start server
        run: |
          python3 -m http.server 4173 >/tmp/v94-http.log 2>&1 &
          sleep 2
      - name: Capture focused diff
        run: node v94/browser-10a-shichrut-diff.mjs
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v94-10a-shichrut-diff.json
          git commit -m 'Capture 10a shichrut migration diff' || exit 0
          git pull --rebase origin v94/architecture-migration
          git push origin HEAD:v94/architecture-migration
